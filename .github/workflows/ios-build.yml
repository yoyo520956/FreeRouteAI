name: iOS Build

# FreeRoute AI / 自由路由 — 云端 macOS + Xcode 构建
# GitHub Actions 只是构建环境；App 本体完全运行在 iPhone 上，不依赖任何云端服务。
# 公开仓库使用 GitHub-hosted Runner（含 macOS）对公开仓库免费。
#
# 为什么是「单个 job」：GitHub 注解过 "Due to capacity constraints, jobs targeting
# macOS arm64 runners may experience longer queue times"，多 job 链一旦首个 job
# 未拿到 Runner 被取消，后续 job 全部 skipped。单 job 只需一次调度机会。

on:
  workflow_dispatch:
    inputs:
      runner_image:
        description: "Runner 镜像（macOS 容量池按镜像分，排队久就换一个）"
        type: choice
        required: false
        default: "macos-26"
        options: ["macos-26", "macos-15", "macos-14"]
      xcode:
        description: "Xcode 版本（必须是 Runner 已预装的版本）"
        required: true
        default: "26.6"
      run_ui_tests:
        description: "运行 UI 测试并逐屏截图"
        type: boolean
        required: false
        default: true
      signing:
        description: "签名方式（none = 只验证编译与打包链路）"
        type: choice
        required: false
        default: "none"
        options: ["none", "manual", "automatic"]
  push:
    branches: [main]
  pull_request:

# 按「分支 + 镜像」分组：容量紧张时可同时向多个镜像排队，且不再互相取消
concurrency:
  group: freeroute-${{ github.ref }}-${{ github.event.inputs.runner_image }}
  cancel-in-progress: false

env:
  SCHEME: FreeRoute
  PROJECT: FreeRoute.xcodeproj
  DERIVED: ${{ github.workspace }}/DerivedData

jobs:
  build:
    name: 环境核查 · 编译 · 测试 · Archive
    runs-on: ${{ github.event.inputs.runner_image || 'macos-26' }}
    timeout-minutes: 45
    env:
      SIGNING: ${{ github.event.inputs.signing }}
      XCODE_PICK: ${{ github.event.inputs.xcode }}

    steps:
      - uses: actions/checkout@v4

      # ── 步骤 1–3：环境核查（如实报告，不许猜）──
      - name: 步骤 1 · 选择 Xcode
        run: |
          X="${XCODE_PICK:-26.6}"
          if [ -d "/Applications/Xcode_${X}.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_${X}.app/Contents/Developer" >> "$GITHUB_ENV"
            echo "选用：Xcode ${X}"
          else
            echo "⚠️ Runner 未预装 Xcode ${X}，使用默认版本：$(xcode-select -p)"
          fi
      - name: 步骤 2 · Xcode 版本
        run: xcodebuild -version
      - name: 步骤 3 · Swift 版本与可用 SDK
        run: |
          swift --version
          xcodebuild -showsdks | grep -i iphoneos || true
          printf '%s\n' /Applications/Xcode* 2>/dev/null || true
      - name: SDK 现实核查（不偷换 SDK 假装达标）
        if: always()
        run: |
          {
            echo "## SDK 现实核查"
            echo '```'
            xcodebuild -version 2>/dev/null
            xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || true
            echo '```'
            echo "- 需求指定 iOS 27.3 beta 1 SDK：**GitHub 公开 Runner 不提供**。"
            echo "- \`macos-26\` 最高 Xcode 26.6（iOS 26.x SDK）；官方 Xcode 27 预览镜像最高 iOS 27.2。"
            echo "- 处理原则：不用不兼容 SDK 冒充达标，也不虚报 beta 构建成功；用 Runner 最新正式版编译，最低部署目标保持 iOS 17.0。"
            echo "- 模拟器机型说明：Runner 已不提供 iPhone SE (3rd generation)，截图不等于 SE 3 真机截图。"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 步骤 4–5：工程生成与编译 ──
      - name: 安装 xcodegen
        run: brew install xcodegen
      - name: 步骤 3.5 · 静态自检（几分钟内暴露低级错误，省排队）
        run: |
          python3 tools/selfcheck.py
          python3 tools/check-callsites.py
          python3 tools/check-members.py
          python3 tools/check-project.py

      - name: 步骤 4 · 依赖解析（零第三方依赖，仅生成工程）
        run: |
          xcodegen generate
          # 对照：磁盘上的 Swift 文件 vs 工程 Sources 阶段实际收录的文件。
          # 若工程里明显少于磁盘，说明某个 target 的 sources 没吃到文件。
          DISK=$(find FreeRoute FreeRouteWidget FreeRouteTests FreeRouteUITests -name '*.swift' | wc -l | tr -d ' ')
          INPROJ=$(grep -c '\.swift in Sources' FreeRoute.xcodeproj/project.pbxproj || true)
          echo "磁盘 Swift 文件：$DISK，工程 Sources 收录：$INPROJ"
          [ "$INPROJ" -ge "$DISK" ] || echo "::warning::工程收录的 Swift 文件少于磁盘上的数量，检查 project.yml 的 sources"

          xcodebuild -list -project "$PROJECT"
      - name: 步骤 5 · 编译（iOS 模拟器，不签名）
        id: simbuild
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO

      # ── 步骤 6–7：测试 ──
      - name: 未签名模式
        if: env.SIGNING == 'none' || env.SIGNING == ''
        run: echo "CODE_SIGN_ARGS=CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=" >> "$GITHUB_ENV"
      - name: 手动签名（证书 + 描述文件）
        if: env.SIGNING == 'manual'
        env:
          CERT_P12: ${{ secrets.DEV_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MOBILE_PROVISION_BASE64 }}
          PROFILE_NAME: ${{ secrets.MOBILE_PROVISION_NAME }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$CERT_P12" ] || { echo "缺少 Secrets: DEV_CERT_P12_BASE64"; exit 1; }
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p ci "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          echo "$CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME"
          echo "CODE_SIGN_ARGS=-allowProvisioningUpdates DEVELOPMENT_TEAM=$TEAM" >> "$GITHUB_ENV"
      - name: 自动签名（Apple ID + 专用密码 + Team ID）
        if: env.SIGNING == 'automatic'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$TEAM" ] || { echo "缺少 Secret: APPLE_TEAM_ID"; exit 1; }
          echo "CODE_SIGN_ARGS=-allowProvisioningUpdates DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=Apple Development CODE_SIGNING_ALLOWED=YES" >> "$GITHUB_ENV"

      - name: 步骤 6 · Archive（Release，真机 arm64）
        id: archive
        if: success() && steps.simbuild.outcome == 'success'
        run: |
          xcodegen generate
          # shellcheck disable=SC2086
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FreeRoute.xcarchive" \
            -configuration Release \
            -derivedDataPath "$DERIVED" \
            $CODE_SIGN_ARGS
          # 上一轮出过「Archive SUCCEEDED 但 .app 里没有主程序」的假成功，
          # 这里硬校验，宁可报错也不要把空壳打进 IPA
          APP="$RUNNER_TEMP/FreeRoute.xcarchive/Products/Applications/FreeRoute.app"
          echo "--- Archive 产物清单 ---"
          find "$RUNNER_TEMP/FreeRoute.xcarchive/Products" -type f | sed "s|$APP|.|" | head -30
          if [ ! -f "$APP/FreeRoute" ]; then
            echo "::error::Archive 产物缺少主程序 FreeRoute.app/FreeRoute（App target 未产出可执行文件）"
            exit 1
          fi
          echo "主程序：$(du -h "$APP/FreeRoute" | cut -f1)，扩展：$(du -sh "$APP/PlugIns" 2>/dev/null | cut -f1)"
      - name: 步骤 7 · 导出 IPA
        if: success() && steps.archive.outcome == 'success'
        run: |
          python3 tools/make-export-options.py "${SIGNING:-none}"
          if [ "${SIGNING:-none}" = "none" ]; then
            rm -rf Payload && mkdir -p Payload
            cp -R "$RUNNER_TEMP/FreeRoute.xcarchive/Products/Applications/"*.app Payload/
            ditto -c -k --keepParent Payload FreeRoute-unsigned.ipa
            echo "已生成未签名 IPA：结构完整，但不能直接安装"
          else
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/FreeRoute.xcarchive" \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates
            cp "$RUNNER_TEMP/export/"*.ipa FreeRoute.ipa
          fi
      - name: 选择模拟器（Runner 无 SE3，按可用机型回退）
        id: sim
        if: always()
        run: python3 tools/pick-simulator.py
      - name: 步骤 8 · 单元测试
        id: unit
        if: success() && steps.simbuild.outcome == 'success'
        run: |
          set -o pipefail
          echo "--- 宿主注入实测值（测试解析不到模块时先看这里）---"
          xcodebuild -project "$PROJECT" -target FreeRouteTests -showBuildSettings \
            -destination "id=${{ steps.sim.outputs.ud }}" 2>/dev/null \
            | grep -E "TEST_HOST|BUNDLE_LOADER|ENABLE_TESTABILITY|PRODUCT_MODULE_NAME" || true
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.ud }}" \
            -only-testing:FreeRouteTests \
            -derivedDataPath "$DERIVED" \
            -enableCodeCoverage YES \
            -resultBundlePath UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: 步骤 9 · UI 测试（逐屏截图）
        id: uitest
        if: success() && steps.unit.outcome == 'success' && github.event.inputs.run_ui_tests != 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.ud }}" \
            -only-testing:FreeRouteUITests \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: 收集截图
        if: always()
        run: |
          python3 tools/collect-screenshots.py || true
          {
            echo "## 截图产出"
            if [ -d screenshots ] && [ -n "$(find screenshots -maxdepth 1 -name '*.png' -print -quit)" ]; then
              find screenshots -maxdepth 1 -name '*.png' -printf '  - %f\n';
            else echo "- 无（UI 测试未执行或未产出附件）"; fi
            echo "- 以上如存在，均为 **iOS 模拟器**截图，不等同于真机截图。"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 步骤 8–11：Archive / IPA / 产物 / 报告 ──
      - name: 步骤 10 · 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            FreeRoute*.ipa
            screenshots/
            UnitTests.xcresult
            UITests.xcresult
          if-no-files-found: warn
      - name: 步骤 11 · 构建报告
        if: always()
        run: |
          {
            echo "## 构建报告"
            echo "- 事件：\`${{ github.event_name }}\` ｜ 签名：\`${{ env.SIGNING || 'none' }}\`"
            echo "- Xcode：\`$(xcodebuild -version 2>/dev/null | head -1)\`"
            echo "- Swift：\`$(swift --version 2>&1 | head -1)\`"
            echo "- IPA 产物："
            find . -maxdepth 1 -name 'FreeRoute*.ipa' -printf '  - %f（%s 字节）\n' | sed 's|^\./||' ; [ -n "$(find . -maxdepth 1 -name 'FreeRoute*.ipa' -print -quit)" ] || echo "  - 无"
            echo
            echo "**如实说明**：未签名 IPA 不能直接安装。免费 Apple ID 的 7 天有效期、可安装数量、"
            echo "以及 App Groups / Live Activity 能力限制均由 Apple 决定，本项目不做任何保证；"
            echo "本工程使用 App Group 与推送环境键，完整功能需要付费 Apple Developer 账号签名。"
          } >> "$GITHUB_STEP_SUMMARY"
