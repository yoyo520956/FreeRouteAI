name: FreeRoute
options:
  bundleIdPrefix: com.freeroute.ai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  settings:
    base:
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGNING_ALLOWED: "NO"
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      GENERATE_INFOPLIST_FILE: "NO"

targets:
  FreeRoute:
    type: application
    platform: iOS
    sources:
      - path: FreeRoute
        excludes:
          - "**/.*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeroute.ai
        INFOPLIST_FILE: FreeRoute/Info.plist
        CODE_SIGN_ENTITLEMENTS: FreeRoute/FreeRoute.entitlements
        PRODUCT_NAME: FreeRoute
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        ARCHS: "arm64"
        ENABLE_BITCODE: "NO"
        DEFINES_MODULE: "YES"
        PRODUCT_MODULE_NAME: FreeRoute
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - target: FreeRouteWidget

  FreeRouteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FreeRouteWidget
      - path: FreeRoute/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeroute.ai.widget
        INFOPLIST_FILE: FreeRouteWidget/Info.plist
        PRODUCT_NAME: FreeRouteWidget
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: FreeRouteWidget/FreeRouteWidget.entitlements
        ARCHS: "arm64"
        ENABLE_BITCODE: "NO"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework

  FreeRouteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FreeRouteTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeroute.ai.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: FreeRoute

  FreeRouteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FreeRouteUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeroute.ai.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: FreeRoute

schemes:
  FreeRoute:
    build:
      targets:
        FreeRoute: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FreeRouteTests
        - FreeRouteUITests
    archive:
      config: Release
